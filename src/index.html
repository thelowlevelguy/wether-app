<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
</head>
<body>
    <div id="content">

        <!-- 1. VILLE / EMPLACEMENT ACTIF -->
        <div id="active-location">
            <div>📍<span id="active-location-search"></span> | <span id="active-location-timezone"></span></div>
        </div>

        <!-- 2. BARRE DE RECHERCHE -->
        <div>
            <div id="bar-search" role="search">
                <input type="search" id="location-search" name="q" placeholder="Search city (e.g. Antarctic)..."  />
                <button id="search-btn">Search</button>
            </div>
        </div>

        <!-- 3. CONDITIONS MÉTÉO ACTUELLES -->
        <div id="weather-current-conditions"> 
            
            <!-- Informations Générales -->
            <div id="general-conditions">
                <div id="general-conditions-in-text">
                    <div><span>CURRENT CONDITIONS</span></div>
                    <div id="current-weather-temp"></div>
                    <div class="temp-unit">
                        <button id="temp-unit-celcius">°C</button>
                        <button id="temp-unit-fareinheit">°F</button>
                    </div>
                    <div id="current-weather-desc"><span></span></div>
                </div>
                
                <!-- Icône ou représentation visuelle -->
                <div id="general-conditions-in-view">
                </div>
            </div>

            <!-- Détails (Vent, Humidité, etc.) -->
            <div id="detailled-condition-in-details">
                <div class="metric"><span class="metric-view">💧</span> <span class="metric-indicator">Humidity:</span> <span class="metric-value" id="humidity-indicator"></span></div>
                <div class="metric"><span class="metric-view">💨</span> <span class="metric-indicator">Wind:</span> <span class="metric-value" id="wind-indicator"></span></div>
                <div class="metric"><span class="metric-view">☀️</span> <span class="metric-indicator">UV Index:</span> <span class="metric-value" id="uv-index-indicator"></span></div>
            </div>

        </div>

        <!-- 4. PRÉVISIONS SUR LES JOURS SUIVANTS (daysAfter) -->
        <div id="weather-following-days">
            <div><span>DAYS AFTER (7-DAY FORECAST)</span></div>
            <div class="forecast-list">
            </div>
        </div>

    </div>
</body>
</html>
